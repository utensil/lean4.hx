[package]
name = "lean4-hx"
version = "0.0.0"
edition = "2021"
publish = false
description = "Lean-aware Helix integration"
license = "Apache-2.0"

[lib]
name = "lean4_hx"
crate-type = ["rlib", "cdylib"]

[dependencies]
steel-core = { git = "https://github.com/utensil/steel.git", rev = "24cd21598c091fb88bc10a6375a1ded25e677c37", features = ["dylibs", "sync"] }
abi_stable = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace]
resolver = "2"
members = ["."]
